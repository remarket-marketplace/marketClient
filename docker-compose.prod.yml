services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: force-market-frontend-prod
    ports:
      - "80:4173"
    environment:
      - NODE_ENV=production
      - API_URL=https://re-market.net/v1
      - FILE_BASE=http://host.docker.internal:8000/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
